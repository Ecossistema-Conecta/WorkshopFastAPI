services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./database.db
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  docs:
    build: .
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=sqlite:///./database.db
    volumes:
      - .:/app
    command: >
      mkdocs serve --dev-addr=0.0.0.0:8005 --watch-theme --watch=docs --watch=app

  dashboard:
    build: .
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./database.db
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: >
      sh -c "alembic upgrade head &&
             streamlit run app/streamlit_app/main.py
             --server.port=8501
             --server.address=0.0.0.0"
